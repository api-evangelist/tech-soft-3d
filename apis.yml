aid: tech-soft-3d
name: Tech Soft 3D
description: >-
  Tech Soft 3D builds developer SDKs and enterprise applications that power 3D
  data exchange, visualization, and analysis across engineering, manufacturing,
  and design. Its HOOPS toolkits (Exchange for CAD data translation and access,
  Visualize for high-performance 3D graphics, Access, Mesh, Solve, and Envision)
  are licensed to OEMs and independent developers building CAD, CAM, CAE, and PLM
  software, and it also distributes Siemens Parasolid and Polygonica. Alongside the
  native toolkits it publishes the HOOPS Visualize Web Components (open, first-party
  npm packages), SpinFire enterprise viewing/conversion apps, and OEM technologies
  such as AutoCAD OEM, Inventor OEM, and RealDWG. Tech Soft 3D is backed by Battery
  Ventures.
